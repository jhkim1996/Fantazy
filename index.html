<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>떨어진 별의 노래</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap">
<style>
:root{--bg:#faf9f5;--card:#f1efe8;--text:#2c2c2a;--sub:#5f5e5a;--acc-bg:#e6f1fb;--acc-line:#185fa5;--acc-text:#0c447c;--line:#d3d1c7;--ok:#27500a;--ok-bg:#eaf3de;--bad:#791f1f;--bad-bg:#fcebeb;--neu:#5c4813;--neu-bg:#f3ead2;--hp:#e24b4a;--mp:#378add;--xp:#ba7517;--foe:#a03a2c;--star:#b8860b;--r-unc:#2f7a2f;--r-rare:#1f5fbf;--r-leg:#b0570f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1e1d;--card:#2c2c2a;--text:#f1efe8;--sub:#b4b2a9;--acc-bg:#0c447c;--acc-line:#85b7eb;--acc-text:#b5d4f4;--line:#444441;--ok:#c0dd97;--ok-bg:#27500a;--bad:#f7c1c1;--bad-bg:#791f1f;--neu:#ecd9a6;--neu-bg:#4a3c17;--foe:#e8836f;--star:#f0c75e;--r-unc:#93d493;--r-rare:#8ab8ff;--r-leg:#f2a65a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f1e1d;--card:#2c2c2a;--text:#f1efe8;--sub:#b4b2a9;--acc-bg:#0c447c;--acc-line:#85b7eb;--acc-text:#b5d4f4;--line:#444441;--ok:#c0dd97;--ok-bg:#27500a;--bad:#f7c1c1;--bad-bg:#791f1f;--neu:#ecd9a6;--neu-bg:#4a3c17;--foe:#e8836f;--star:#f0c75e;--r-unc:#93d493;--r-rare:#8ab8ff;--r-leg:#f2a65a;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;padding-block:12px;padding-inline:16px;background:var(--bg);color:var(--text);font-family:system-ui,"Malgun Gothic",sans-serif;font-size:14px;line-height:1.5}
h2{font-size:13px;font-weight:500;color:var(--sub);margin:18px 0 8px}
.card{background:var(--card);border-radius:12px;padding:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sub{color:var(--sub);font-size:12px}
button{font:inherit;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc-line);outline-offset:2px}
button.on,.opt.on{background:var(--acc-bg);border-color:var(--acc-line);color:var(--acc-text)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:4px 0 8px}
.bar>i{display:block;height:100%}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
.stat{background:var(--bg);border-radius:8px;padding:6px;text-align:center}
.stat b{display:block;font-size:18px;font-weight:500}
.opt{display:block;width:100%;text-align:left;margin-bottom:6px;padding:8px 10px}
.opt:last-child{margin-bottom:0}
.opt:disabled{opacity:.4}
.opt small{display:block;color:var(--sub)}
.opt.on small{color:var(--acc-text)}
.opt.star{border-color:var(--star)}
.opt.star b{color:var(--star)}
.die{width:120px;height:120px;border-radius:16px;background:var(--card);padding:0;display:flex;align-items:center;justify-content:center;flex:none}
.die g{transform-origin:70px 70px}
.result{border-radius:12px;padding:12px}
.result.ok{background:var(--ok-bg);color:var(--ok)}
.result.bad{background:var(--bad-bg);color:var(--bad)}
.result.neu{background:var(--neu-bg);color:var(--neu)}
.result b{font-size:18px;font-weight:500}
.result .sub{color:inherit;opacity:.85}
ul{margin:0;padding-left:18px}
details{margin-top:18px}
summary{cursor:pointer;color:var(--sub);font-size:13px}
.saga{font-size:12px;color:var(--sub)}
#stitle{font-size:20px;font-weight:600;margin:2px 0 10px}
.prose p{margin:0 0 10px;font-family:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo","Batang",serif;font-size:15px;line-height:1.8;word-break:keep-all}
.prose p:last-child{margin-bottom:0}
.story{margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--bg)}
.downbox{margin-top:8px;padding:10px 12px;border-radius:8px;border:1px dashed var(--bad);color:var(--bad);font-size:13px}
.next{display:block;width:100%;margin-top:12px;padding:10px;font-weight:500;background:var(--acc-bg);border-color:var(--acc-line);color:var(--acc-text)}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 0}
.item>div{min-width:0}
.item button{padding:2px 10px;font-size:12px;flex:none}
.sumrow{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.sumrow:last-child{border-bottom:0}
.sumrow b{flex:0 0 112px;font-weight:500;color:var(--sub);word-break:keep-all}
#copybox{display:block;width:100%;min-height:160px;margin-top:8px;font:12px/1.5 ui-monospace,monospace;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
.notice{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--neu-bg);color:var(--neu);font-size:13px}
.hudtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hudnums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 10px}
.hudnums .bar{margin-bottom:2px}
.mini{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
/* 모험가 만들기 */
.steps{display:flex;gap:6px;margin:18px 0 8px}
.steps span{flex:1;text-align:center;font-size:12px;padding:4px 0;border-bottom:2px solid var(--line);color:var(--sub)}
.steps span.done{color:var(--text)}
.steps span.on{border-color:var(--acc-line);color:var(--acc-text);font-weight:500}
.mk-title{font-size:16px;font-weight:600;margin-bottom:4px}
.mk-body{display:grid;gap:10px}
.rolls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.roll{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;background:var(--bg)}
.roll b{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.roll small{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.roll.on small{color:var(--acc-text)}
.roll s{opacity:.55}
.roll.used{opacity:.6}
.mkstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mkstat{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:var(--bg)}
.mkstat b{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.big{width:100%;padding:12px;font-weight:500;background:var(--acc-bg);border-color:var(--acc-line);color:var(--acc-text)}
.nav{display:flex;gap:8px}
.nav button{flex:1;padding:10px}
.nav .go{background:var(--acc-bg);border-color:var(--acc-line);color:var(--acc-text);font-weight:500}
.cls-name{font-size:15px;font-weight:600}
input[type=text]{font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.sheet{background:var(--bg);border-radius:8px;padding:10px 12px}
.sheet .stats{margin-top:6px}
.sheet .stat{background:var(--card)}
/* 지도 */
.map{display:block;width:100%;height:auto;background:var(--bg);border-radius:8px}
.map .link{stroke:var(--line);stroke-width:3;stroke-linecap:round}
.map .node{fill:var(--card);stroke:var(--sub);stroke-width:2}
.map .node.here{fill:var(--acc-line);stroke:var(--acc-line)}
.map .node.adj{stroke:var(--acc-line);cursor:pointer}
.map text{fill:var(--text);font-size:11px;font-family:system-ui,sans-serif}
.map text.lv{fill:var(--sub);font-size:9px}
.map .starmark{fill:var(--star);font-size:13px}
.map g.adj{cursor:pointer}
/* 전투 */
.foes{display:grid;gap:8px}
.foe{display:block;width:100%;text-align:left;padding:10px 12px;background:var(--card)}
.foe.on{border-color:var(--foe);background:var(--card);color:var(--text)}
.foe.dead{opacity:.35}
.foe .bar{margin:6px 0 4px}
.foe .tag{font-size:11px;color:var(--foe);font-weight:500}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.acts button{padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.acts button small{font-size:11px;color:var(--sub);text-align:center}
.acts .wide{grid-column:1/-1}
.acts.fin{grid-template-columns:minmax(0,1fr) minmax(0,2fr);margin-top:8px}
.foe.pc{cursor:default}
.foe.pc.on{border-color:var(--acc-line)}
.foe.down{opacity:.7;border-style:dashed}
.initbar{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.ini{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.ini.s-foe{color:var(--foe)}
.ini.cur{border-color:var(--acc-line);background:var(--acc-bg);color:var(--acc-text);font-weight:500}
.ini.s-foe.cur{border-color:var(--foe);background:var(--bad-bg);color:var(--bad)}
.ini.down{opacity:.5;text-decoration:line-through}
.zone{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:8px 0 4px}
.zone b{font-weight:500}
.surf{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line)}
.surf.oil{background:#2a2216;color:#e8dcc0;border-color:#2a2216}
.surf.water{background:#2d5f8a;color:#e6f1fb;border-color:#2d5f8a}
.surf.fire{background:#c4561e;color:#fff3e0;border-color:#c4561e}
.surf.ice{background:#cfeaff;color:#18405e;border-color:#9cc8e6}
.surf.high{border-style:dashed}
.pips{display:flex;gap:10px;margin:10px 0 8px;font-size:12px;color:var(--sub)}
.pips span.on{color:var(--text);font-weight:500}
.acts .go{background:var(--acc-bg);border-color:var(--acc-line);color:var(--acc-text)}
.acts .go small{color:var(--acc-text)}
.clog{list-style:none;padding:0;margin:0;display:grid;gap:3px;font-size:13px}
.clog li{padding-left:10px;border-left:3px solid var(--line)}
.clog li.me{border-color:var(--acc-line)}
.clog li.foe{border-color:var(--foe)}
.clog li.sys{border-color:var(--star);color:var(--sub)}
.clog li.old{opacity:.55}
.art{display:block;width:100%;height:auto;aspect-ratio:640/280;border-radius:12px;margin-bottom:10px;background:#1b1f27}
body.combat .art{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.foes.two{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.foes.two .foe{padding:7px 9px}
.foes.two .hudtop{flex-direction:column;align-items:flex-start;gap:0}
.foes.two .foe .bar{margin:4px 0 2px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:8px}
.buy{display:grid;gap:6px}
.buyrow{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;background:var(--bg);border-radius:8px;padding:6px 10px}
.buyrow b{min-width:72px;text-align:center;font-variant-numeric:tabular-nums}
.buyrow button{width:36px;padding:4px 0;font-size:16px}
.skills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;margin-top:6px}
.skrow{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:baseline;font-size:13px;color:var(--sub)}
.skrow.prof{color:var(--text)}
.skrow b{font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
.insp{color:var(--star);letter-spacing:.1em}
.chip.gold{border-color:var(--star);color:var(--star)}
.chip.up,.ap.up{border-color:var(--ok);color:var(--ok)}
.chip.down,.ap.down{border-color:var(--bad);color:var(--bad)}
.rar-uncommon{color:var(--r-unc)}
.rar-rare{color:var(--r-rare)}
.rar-legendary{color:var(--r-leg)}
.lvopt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.lvopt .opt{margin:0}
/* 배치: 좁은 화면은 한 줄(상태 → 장면 → 할 일 → 전장), 넓은 화면은 오른쪽에 상태나 전장을 붙인다 */
.wrap{max-width:640px;margin-inline:auto}
.main{display:contents}
#clock{margin-top:10px}
.foot{margin-top:18px}
.hud{margin-bottom:10px}
@media (min-width:960px){
  .wrap{max-width:1060px;display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-areas:"main side" "foot side";grid-template-rows:auto 1fr;column-gap:24px;align-items:start}
  .main{display:block;grid-area:main;min-width:0}
  #hud,#cside{grid-area:side;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto}
  #hud{margin:0}
  .cside>h2:first-child{margin-top:0}
  .foot{grid-area:foot}
  body.solo .wrap{max-width:680px;grid-template-columns:minmax(0,1fr);grid-template-areas:"main" "foot"}
  body.combat .art{position:static;box-shadow:none}
  .narrow-only{display:none!important}
}
@media (max-width:959.98px){.wide-only{display:none!important}}
/* 상태 */
.who{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.who b{font-size:15px;font-weight:600}
.who .lv{margin-left:auto}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 10px;margin-top:6px}
.meters .bar,.pmini .bar{margin:3px 0 0}
.pmini .bar{height:5px}
.ml{display:flex;justify-content:space-between;gap:4px;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.ml>span:first-child{overflow:hidden;text-overflow:ellipsis}
.hudmeta{margin-top:6px}
.pmini{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:6px 10px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.pmini .ap{font-size:11px}
.hudsec{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.hudsec .stats{margin-top:0}
h3{font-size:12px;font-weight:500;color:var(--sub);margin:0 0 6px}
.atkline{margin-top:6px}
.qrow+.qrow{margin-top:6px}
/* 탐험 화면 탭 */
.tabs{display:flex;margin:14px 0 2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;border:0;border-bottom:2px solid transparent;border-radius:0;margin-bottom:-1px;padding:9px 8px;color:var(--sub);white-space:nowrap}
.tabs button.on{background:transparent;border-color:transparent;border-bottom-color:var(--acc-line);color:var(--acc-text);font-weight:500}
.tabs .cnt{font-size:11px;margin-left:3px;color:var(--sub);font-weight:400}
.tabs .cnt.star{color:var(--star)}
.xgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:0 14px;align-items:start}
.formrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,170px);gap:8px;align-items:center;margin-top:8px}
.formrow .seg{margin:0}
.formrow .seg button{padding:6px}
.comp+.comp{margin-top:8px}
.comp .bar{margin:6px 0 2px}
.comp details{margin-top:8px}
.comp summary{font-size:12px}
.comp details .sub{margin-top:4px}
.slot{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:8px;align-items:start;padding:5px 0}
.slot+.slot{border-top:1px solid var(--line)}
.slot>.sub{padding-top:1px}
.slot .row{gap:4px}
.slot button{padding:2px 10px;font-size:12px}
.abl{padding:4px 0}
.abl+.abl{border-top:1px solid var(--line)}
.abl.off{opacity:.5}
.abl .cost{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:0 7px;margin-left:4px;white-space:nowrap}
.setrow{display:block}
.setrow+.setrow{margin-top:8px}
</style>
</head>
<body>
<div class="wrap">

<div id="hud" class="hud card" hidden></div>

<div class="main">
<canvas id="art" class="art" aria-hidden="true"></canvas>
<div class="card scene">
  <div class="saga" id="saga"></div>
  <div id="stitle"></div>
  <div class="prose" id="scene"></div>
  <div class="sub" id="clock"></div>
</div>
<div class="notice" id="notice" hidden></div>

<div id="make" hidden></div>

<div id="lvwrap" hidden>
  <h2>레벨 업! 하나를 고르세요</h2>
  <div class="lvopt" id="lvopts"></div>
</div>

<div id="world" hidden></div>

<div id="event" hidden>
  <div id="playwrap">
    <h2>선택지</h2>
    <div id="choices"></div>
    <div id="rollwrap">
      <h2>판정</h2>
      <div class="card">
        <div class="row" id="mods"></div>
        <div class="row" style="margin-top:8px">
          <button class="die" id="die" aria-label="굴리기" disabled>
            <svg width="100" height="100" viewBox="0 0 140 140">
              <g id="shape">
                <polygon points="70,10 122,40 122,100 70,130 18,100 18,40" fill="var(--acc-bg)" stroke="var(--acc-line)" stroke-width="2" stroke-linejoin="round"/>
                <path d="M70,10 L18,100 M70,10 L122,100 M18,40 L122,40 M18,100 L122,100 M70,130 L18,40 M70,130 L122,40" stroke="var(--acc-line)" stroke-width="1" fill="none" opacity=".6"/>
              </g>
              <text id="num" x="70" y="82" text-anchor="middle" font-size="36" font-weight="500" fill="var(--acc-text)">?</text>
            </svg>
          </button>
          <div style="flex:1;min-width:140px">
            <div class="sub" id="hint">선택지를 고르고 주사위를 누르세요</div>
            <div id="calc" style="font-size:18px;font-weight:500"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="reswrap">
    <h2>결과</h2>
    <div id="resbox"></div>
  </div>
</div>

<div id="combat" hidden></div>

<div id="endwrap" hidden>
  <h2>2장으로 이어지는 기록</h2>
  <div class="card" id="summary"></div>
  <div class="row" style="margin-top:8px"><button id="copy">기록 복사</button><span class="sub" id="copied"></span></div>
  <textarea id="copybox" readonly hidden aria-label="복사할 기록"></textarea>
  <button class="next" id="goon">계속 탐험하기 →</button>
</div>

<div id="logwrap" hidden>
  <h2>진행 기록 (최근)</h2>
  <div class="card"><ul id="log"></ul></div>
</div>

<details id="freedice">
  <summary>자유 주사위 (판정과 무관)</summary>
  <div class="card" style="margin-top:8px">
    <div class="row" id="ftypes"></div>
    <div class="row" style="margin-top:8px">
      <button id="froll">굴리기</button>
      <button id="freset">초기화</button>
      <span id="fres" style="font-size:18px;font-weight:500"></span>
    </div>
    <div class="sub" id="fhist" style="margin-top:6px"></div>
  </div>
</details>
</div>

<div id="cside" class="cside" hidden></div>

<div class="foot row"><button id="restart">처음부터 다시</button></div>
</div>

<script src="chapter1.js"></script>
<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
